name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 application/backend/app --max-line-length=100

      - name: Run unit tests
        run: pytest tests/unit -m unit

      - name: Run API tests
        run: pytest tests/api -m api

      - name: Run end-to-end workflow tests
        run: pytest tests/e2e -m e2e

      - name: Run full suite with coverage
        run: pytest --cov=application/backend/app --cov-report=term-missing --cov-fail-under=85

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install dependencies
        working-directory: application/frontend
        run: npm install

      - name: Build
        working-directory: application/frontend
        run: npm run build
